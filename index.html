function textW(s,sc=1){g.save();g.font=fontFace(sc);const w=g.measureText(String(s)).width;g.restore();return w;}

  g.fillStyle='rgba(0,0,0,.6)'; g.fillText(key,x+w/2,y+h/2+.8);

  const result=[];let line='';for(const word of text.split(' ')){const next=line?line+' '+word:word;if(line&&g.measureText(next).width>width){result.push(line);line=word;}else line=next;}if(line)result.push(line);g.restore();return result;

/* ---------- audio (all synthesized) ---------- */

// Hijaz scale on D, from D3 up

  clash(){ noise(0.07,0.3,4200,'bandpass',0,3); tone(2450,0.35,'sine',0.07); tone(3310,0.3,'sine',0.05); tone(1720,0.2,'triangle',0.04); },
  swish(){ noise(0.13,0.12,1800,'bandpass',0,1.5); },
  hit(){ noise(0.12,0.3,450); tone(160,0.14,'sawtooth',0.12,-90); },
  hurt(){ tone(330,0.16,'square',0.09,-160); },
  grunt(){ tone(140,0.12,'sawtooth',0.08,-60); noise(0.1,0.1,500); },
  punch(){ noise(0.07,0.25,500); tone(110,0.07,'sine',0.2,-40); },
  spikes(){ noise(0.07,0.2,3500,'highpass'); tone(1500,0.05,'square',0.04,-500); },
  chomp(){ noise(0.05,0.25,2800,'bandpass',0,2); tone(820,0.04,'square',0.06,-300); },
  impale(){ noise(0.2,0.35,900); tone(200,0.3,'sawtooth',0.1,-150); },
  gulp(){ for(let i=0;i<3;i++){ tone(180+i*20,0.09,'sine',0.18,120,i*0.2); noise(0.05,0.05,400,'lowpass',i*0.2);} },
  door(){ noise(2.4,0.18,180); tone(45,2.4,'sawtooth',0.03,10); },
  pickup(){ [7,9,11,14].forEach((n,i)=>pluck(n,i*0.09,0.4,0.1)); },
  potion(){ [7,9,11,14,16].forEach((n,i)=>pluck(n,0.5+i*0.07,0.5,0.08)); },
  death(){ playSeq([[11,1],[10,1],[9,1],[8,1],[7,3]],0.22,-7,false,true); },
  win(){ playSeq([[7,.5],[9,.5],[11,.5],[14,1],[13,.5],[14,.5],[16,2]],0.2,0,true,true); },
  theme(){ return playSeq(THEME,0.27,0,true,true); }
};
// title music: loops on its own bus so it can be cut instantly
let musicBus=null, musicTimer=null;
function startMusic(){
  stopMusic(); if(!audioRunning()) return;
  musicBus=AC.createGain(); musicBus.gain.value=1; musicBus.connect(MG);
  const bus=musicBus;
  const loop=()=>{ if(musicBus!==bus||!audioRunning()) return; const dur=playSeq(THEME,0.27,0,true,true,bus); musicTimer=setTimeout(loop,(dur+0.5)*1000); };
  loop();
}
function stopMusic(){
  clearTimeout(musicTimer); musicTimer=null;
  if(musicBus){ const b=musicBus; musicBus=null; try{ if(AC) b.gain.setTargetAtTime(0,AC.currentTime,0.06); setTimeout(()=>{try{b.disconnect();}catch(e){}},500); }catch(e){} }
}

/* ============================================================
   LEVEL  —  5 x 2 rooms, each 10 x 3 tiles
   ' ' open air   '#' stone block   '-' floor     '|' pillar
   '~' loose floor  '^' spikes      '/' blade trap 't' floor + torch
   '1'..'9' pressure plate (opens gate/door with same id)
   '!' drop plate (closes gate 1)   'A','B' gates id 1,2   'E' great door (id 5)
   's' sword   'p' small potion   'P' life potion
   ============================================================ */
const LEVEL=[
 "##########"+"#ps--  ###"+"##########"+"##########"+"##########",
 "#-t--- t--"+"--1-t--~--"+"--A!--|-t-"+"--tE- B---"+"--t--|- -P",
 "######---#"+"#######-##"+"##########"+"#####--- #"+"#######5-#",
 "##########"+"##########"+"#p2-t-^-~-"+"--t-/- |-#"+"##########",
 "##########"+"##########"+"########-#"+"###-t-p-##"+"##########",
 "##########"+"##########"+"##########"+"##########"+"##########",
];
const GATE_HOLD={1:9,2:1e9};
const GATE_ID={A:1,B:2};
const DROP_ID={'!':1};
const HINTS={
 "2,1":"A / D TO RUN.  SHIFT + A / D TO STEP CAREFULLY",
 "4,1":"SPACE TO JUMP OVER THE GAP",
 "6,2":"STAND UNDER A LEDGE AND PRESS W TO CLIMB",
 "12,1":"A PRESSURE PLATE... SOMEWHERE A GATE RISES",
 "15,1":"PRESS W HERE TO CLIMB TO THE LEDGE ABOVE",
 "13,0":"X TO PICK UP OBJECTS",
 "21,1":"J TO STRIKE    K TO BLOCK    S TO SHEATHE",
 "32,1":"THE GREAT DOOR IS SEALED",
 "37,2":"FALLING ONE FLOOR IS SAFE. TWO FLOORS HURTS",
 "28,3":"SPIKES! HOLD SHIFT AND STEP SLOWLY, OR JUMP",
 "35,3":"THE BLADES SNAP IN RHYTHM. TIME YOUR RUN",
 "22,3":"THIS PLATE OPENS THE GATE UPSTAIRS",
 "46,1":"THE GREAT DOOR'S PLATE LIES BELOW",
};
const GUARD_DEFS=[
 {c:25,r:1,dir:-1,hp:3,block:0.35,aggr:0.45,react:0.55,kind:'red'},
 {c:31,r:3,dir:1, hp:3,block:0.5, aggr:0.55,react:0.45,kind:'green'},
 {c:43,r:1,dir:-1,hp:4,block:0.66,aggr:0.65,react:0.35,kind:'captain'},
];
const START={c:2,r:1,dir:1};

let T, LW, LH, gates, buttons, looses, fallers, items, torches, spikes, choppers, door, rubble, hintSeen;
function K(c,r){return c+','+r;}
let cacheDirty=true;

function loadLevel(){
  LH=LEVEL.length; LW=LEVEL[0].length;
  T=LEVEL.map(s=>s.split(''));
  gates={}; buttons={}; looses={}; fallers=[]; items=[]; torches=[]; spikes={}; choppers={}; door=null; rubble=new Set(); hintSeen={};
  for(let r=0;r<LH;r++) for(let c=0;c<LW;c++){
    const ch=T[r][c], k=K(c,r);
    if(ch==='t'){ torches.push({c,r,seed:(c*13+r*7)%17}); T[r][c]='-'; }
    else if(ch==='s'||ch==='p'||ch==='P'){ items.push({c,r,type:ch}); T[r][c]='-'; }
    else if(ch>='1'&&ch<='9'){ buttons[k]={c,r,id:+ch,drop:false,pressed:false,stuck:false}; T[r][c]='o'; }
    else if(DROP_ID[ch]){ buttons[k]={c,r,id:DROP_ID[ch],drop:true,pressed:false,stuck:false}; T[r][c]='x'; }
    else if(GATE_ID[ch]){ gates[k]={c,r,id:GATE_ID[ch],p:1,mode:'shut',hold:0,tick:0}; T[r][c]='G'; }
    else if(ch==='E'){ door={c,r,open:0,opening:false,snd:0}; }
    else if(ch==='~'){ looses[k]={c,r,trig:false,t:0,wob:0}; }
    else if(ch==='^'){ spikes[k]={c,r,out:0,hold:0,bloody:false}; }
    else if(ch==='/'){ choppers[k]={c,r,ph:Math.random()*1.5,close:0,bloody:false,active:false}; }
  }
  cacheDirty=true;
}
function tile(c,r){ if(r<0||r>=LH||c<0||c>=LW) return '#'; return T[r][c]; }
function isWall(c,r){ return tile(c,r)==='#'; }
function isFloorT(ch){ return ch!==' '&&ch!=='#'; }
// Is there a standable surface at the bottom of tile (c,r)?
function ground(c,r){ const t=tile(c,r); if(t==='#') return false; return isFloorT(t)||tile(c,r+1)==='#'; }
function gateAt(c,r){ return gates[K(c,r)]; }
function gateBlocks(gt){ return gt && gt.p>0.3; }

/* ============================================================
   TILE ART  (static parts are cached per room)
   ============================================================ */
const STONE_D=[39,51,65], STONE_L=[87,99,108];
const PAL={
  back:'#0a0b19', backBrick:'#11142a', backBrickHi:'#181c36', backMortar:'#07081a',
  top:'#7c85a6', topHi:'#a3abc8', topLo:'#5f6889', front:'#474f70', frontHi:'#5d6688', under:'#262a40',
  mortar:'#151829'
};
function px(cx,x,y,col,w=1,h=1){cx.fillStyle=col;cx.fillRect(x,y,w,h);}


/* Material and ornamental primitives, shared by the palace and its machinery. */
function gradient(cx,x,y,w,h,stops){const gr=cx.createLinearGradient(x,y,x+w,y+h);stops.forEach(([p,c])=>gr.addColorStop(p,c));return gr;}
function shape(cx,points,fill,stroke=null,width=.3){cx.beginPath();points.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.closePath();cx.fillStyle=fill;cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=width;cx.stroke();}}
function line(cx,pts,col,width=.3){cx.strokeStyle=col;cx.lineWidth=width;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();pts.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.stroke();}
function jewel(cx,x,y,r,col){cx.fillStyle=col;cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.fill();cx.fillStyle='rgba(255,245,218,.7)';cx.beginPath();cx.arc(x-r*.3,y-r*.3,r*.22,0,Math.PI*2);cx.fill();}
function rosette(cx,x,y,r,color){cx.save();cx.translate(x,y);cx.strokeStyle=color;cx.lineWidth=.22;for(let k=0;k<8;k++){cx.rotate(Math.PI/4);cx.beginPath();cx.moveTo(0,-r);cx.quadraticCurveTo(r*.7,-r*.35,0,0);cx.quadraticCurveTo(-r*.7,-r*.35,0,-r);cx.stroke();}cx.beginPath();cx.arc(0,0,r*.36,0,Math.PI*2);cx.stroke();cx.restore();}
function rivet(cx,x,y,r=.55){jewel(cx,x,y,r,'#a99062');cx.strokeStyle='#342f2a';cx.lineWidth=.15;cx.beginPath();cx.moveTo(x-r*.4,y);cx.lineTo(x+r*.4,y);cx.stroke();}
function steel(cx,x,y,w,h,dark=false){return gradient(cx,x,y,w,0,[[0,'#1b2835'],[.18,dark?'#516778':'#899aa5'],[.35,dark?'#7f939d':'#dae7df'],[.47,'#4c6271'],[.7,dark?'#283b49':'#7d919a'],[1,'#182431']]);}

function drawBack(cx,c,r,x,y){
  const R=rng(c*9173+r*3571+11);
  cx.fillStyle=PAL.back; cx.fillRect(x,y,TW,TH);
  cx.save(); cx.beginPath(); cx.rect(x,y,TW,TH); cx.clip();
  // faint patches of back-wall masonry
  if(R()<0.62){
    const n=2+Math.floor(R()*3), y0=y+4+Math.floor(R()*20);
    for(let k=0;k<n;k++){
      const yy=y0+k*9, off=((r*3+k)%2)?8:0;
      for(let bx=x-off-16;bx<x+TW;bx+=16){
        if(R()<0.18) continue;
        const cl=R()<0.3?'#0e1124':PAL.backBrick;
        cx.fillStyle=PAL.backMortar; cx.fillRect(bx,yy,16,9);
        cx.fillStyle=cl; cx.fillRect(bx+1,yy+1,15,8);
        cx.fillStyle=PAL.backBrickHi; cx.fillRect(bx+1,yy+1,15,1);
        cx.fillStyle='#0a0c1e'; cx.fillRect(bx+1,yy+8,15,1);
      }
    }
  }
  // lower wainscot of larger dark blocks
  if(R()<0.5){ const yy=y+34; for(let bx=x;bx<x+TW;bx+=16){ cx.fillStyle='#0d0f22'; cx.fillRect(bx+1,yy,15,19); cx.fillStyle='#141834'; cx.fillRect(bx+1,yy,15,1);} }
  // cracks and chips
  if(R()<0.35){ let cx0=x+4+R()*24|0, cy0=y+6+R()*30|0; cx.fillStyle='#04050d'; for(let i=0;i<6;i++){ cx.fillRect(cx0,cy0,1,1); cx0+=R()<0.5?1:0; cy0+=1; if(R()<0.3) cx0--; } }
  drawRecess(cx,c,r,x,y);
  // ceiling shadow under the tile above
  const up=tile(c,r-1);
  if(up!==' '){ cx.fillStyle='rgba(0,0,0,0.55)'; cx.fillRect(x,y,TW,3); cx.fillStyle='rgba(0,0,0,0.3)'; cx.fillRect(x,y+3,TW,3); }
  // shadow cast by a wall to the left
  if(tile(c-1,r)==='#'){ cx.fillStyle='rgba(0,0,0,0.45)'; cx.fillRect(x,y,3,TH); cx.fillStyle='rgba(0,0,0,0.2)'; cx.fillRect(x+3,y,3,TH); }
  cx.restore();
}

function drawStone(cx,R,x,y,w,h){
  const base=mix(STONE_D,STONE_L,R()*0.85+(R()<0.1?0.15:0));
  const stone=cx.createLinearGradient(x,y,x+w,y+h);
  stone.addColorStop(0,rgb(shade(base,13)));stone.addColorStop(.45,rgb(base));stone.addColorStop(1,rgb(shade(base,-19)));
  cx.fillStyle=stone; cx.fillRect(x,y,w,h);
  for(let i=0;i<w*h*1.2;i++){
    const a=R();cx.fillStyle=a>.48?'rgba(216,210,193,.10)':'rgba(5,12,26,.16)';
    cx.fillRect(x+R()*w,y+R()*h,.08+R()*.28,.08+R()*.18);
  }
  cx.strokeStyle='rgba(210,217,233,.13)';cx.lineWidth=.3;
  cx.strokeRect(x+1.5,y+1.5,w-3,h-3);
  cx.fillStyle=rgb(shade(base,26)); cx.fillRect(x,y,w,.45);
  cx.fillStyle=rgb(shade(base,12)); cx.fillRect(x,y,.45,h);
  cx.fillStyle=rgb(shade(base,-26)); cx.fillRect(x,y+h-1,w,1);
  cx.fillStyle=rgb(shade(base,-14)); cx.fillRect(x+w-1,y,1,h);
  const sp=2+Math.floor(R()*5);
  for(let i=0;i<sp;i++){ cx.fillStyle=rgb(shade(base,R()<0.6?-20:14)); cx.fillRect(x+1+Math.floor(R()*(w-2)),y+1+Math.floor(R()*(h-2)),1,1); }
  if(R()<0.22){let a=x+2+R()*(w-4),b=y+1;cx.strokeStyle=rgb(shade(base,-34));cx.lineWidth=.3;cx.beginPath();cx.moveTo(a,b);for(let i=0;i<h-2;i+=1.4){a+=(R()-.5)*1.8;cx.lineTo(a,b+i);}cx.stroke();}
  if(R()<0.15){ cx.fillStyle=rgb(shade(base,-30)); cx.fillRect(x+w-3,y+1,2,2); }
}

function drawWall(cx,c,r,x,y){
  const R=rng(c*7919+r*104729+17);
  const top=y-7, bot=y+TH;
  cx.save(); cx.beginPath(); cx.rect(x,top-2,TW,bot-top+2); cx.clip();
  cx.fillStyle=PAL.mortar; cx.fillRect(x,top,TW,bot-top);
  const courses=[[top,17],[top+17,17],[top+34,18],[top+52,18]];
  courses.forEach(([cy,h],i)=>{
    let sx=x-((r*4+i+c)%2?10:2)-Math.floor(R()*4);
    while(sx<x+TW){ const w=11+Math.floor(R()*12); drawStone(cx,R,sx+1,cy+1,w-1,h-1); sx+=w; }
  });
  // Recessed royal seal carved into selected uninterrupted masonry panels.
  if(c%4===1&&tile(c-1,r)==='#'&&tile(c+1,r)==='#'){
    const mx=x+16,my=y+25;
    shape(cx,[[mx,my-14],[mx+13,my],[mx,my+14],[mx-13,my]],'#283945','#778681',.5);
    shape(cx,[[mx,my-12.3],[mx+11.3,my],[mx,my+12.3],[mx-11.3,my]],gradient(cx,mx-11,my-12,22,24,[[0,'#172c38'],[.5,'#3b515b'],[1,'#203541']]),'#9a967c',.2);
    rosette(cx,mx,my,9,'#849180');rosette(cx,mx,my,6.2,'#a39c7e');jewel(cx,mx,my,2,'#5b777c');
    for(const [dx,dy] of [[0,-12],[12,0],[0,12],[-12,0]])jewel(cx,mx+dx,my+dy,.6,'#b1a172');
  }
  // walkable top surface if open above
  if(tile(c,r-1)!=='#'){
    cx.fillStyle=PAL.top; cx.fillRect(x,top-2,TW,4);
    cx.fillStyle=PAL.topHi; cx.fillRect(x,top-2,TW,1);
    cx.fillStyle=PAL.frontHi; cx.fillRect(x,top+2,TW,1);
    for(let i=0;i<4;i++) px(cx,x+Math.floor(R()*TW),top-1+Math.floor(R()*3),R()<0.5?PAL.topLo:PAL.topHi);
  }
  // exposed side faces
  if(tile(c-1,r)!=='#'){ cx.fillStyle='rgba(0,0,0,0.35)'; cx.fillRect(x,top,2,bot-top); cx.fillStyle='rgba(170,180,215,0.25)'; cx.fillRect(x+2,top+2,1,bot-top-2); }
  if(tile(c+1,r)!=='#'){ cx.fillStyle='rgba(0,0,0,0.45)'; cx.fillRect(x+TW-3,top,3,bot-top); }
  if(tile(c,r+1)!=='#'){ cx.fillStyle='rgba(0,0,0,0.5)'; cx.fillRect(x,bot-3,TW,3); }
  cx.restore();
}

function drawFloor(cx,c,r,x,y,seedOff=0){
  const R=rng(c*31337+r*977+5+seedOff);
  const ts=y+53;
  cx.fillStyle=PAL.top; cx.fillRect(x,ts,TW,4);
  cx.fillStyle=PAL.topHi; cx.fillRect(x,ts,TW,1);
  for(let i=0;i<7;i++) px(cx,x+Math.floor(R()*TW),ts+1+Math.floor(R()*3),R()<0.6?PAL.topLo:'#8e97b8');
  cx.fillStyle=PAL.front; cx.fillRect(x,ts+4,TW,7);
  cx.fillStyle=PAL.frontHi; cx.fillRect(x,ts+4,TW,1);
  cx.fillStyle=PAL.under; cx.fillRect(x,ts+11,TW,2);
  cx.fillStyle='#363d5a'; cx.fillRect(x+Math.floor(8+R()*16),ts+5,1,6);
  if(R()<0.5){ cx.fillStyle='#3a4262'; cx.fillRect(x+Math.floor(R()*28),ts+7,3,1); }
  cx.fillStyle='rgba(207,195,159,.25)';cx.fillRect(x,ts+.4,TW,.35);
  for(let k=0;k<4;k++){
    const xx=x+k*8;cx.strokeStyle='#30374f';cx.lineWidth=.4;
    cx.strokeRect(xx+.8,ts+5.5,6.5,3.5);
    cx.fillStyle='#92939b';cx.fillRect(xx+1,ts+5.5,5,.3);
  }
  for(let k=0;k<28;k++){
    cx.fillStyle=R()<.5?'rgba(8,15,32,.3)':'rgba(201,207,223,.22)';
    cx.fillRect(x+R()*32,ts+R()*9,.3+R()*.7,.3);
  }
  const openL=!ground(c-1,r)&&tile(c-1,r)!=='#', openR=!ground(c+1,r)&&tile(c+1,r)!=='#';
  if(openL){ cx.fillStyle='#2a3048'; cx.fillRect(x,ts+1,1,12); cx.fillStyle=PAL.topHi; cx.fillRect(x+1,ts,1,5); }
  else { cx.fillStyle='#3b4262'; cx.fillRect(x,ts+4,1,7); }
  if(openR){ cx.fillStyle='#1e2236'; cx.fillRect(x+TW-2,ts+1,2,12); cx.fillStyle='#333a56'; cx.fillRect(x+TW-3,ts+4,1,7); }
}

function drawDoorFrame(cx,x,y){
  // great exit door: stone arch, stairs rising into the dark
  const L=x-6, Wd=44, top=y+2;
  cx.fillStyle='#050508'; cx.fillRect(L+4,top+6,Wd-8,50);
  for(let k=0;k<5;k++){ const sy=y+50-k*8; cx.fillStyle=k%2?'#2a3048':'#323a58'; cx.fillRect(L+6+k*6,sy,Wd-12-k*6,8); cx.fillStyle='#4a5378'; cx.fillRect(L+6+k*6,sy,Wd-12-k*6,1); }
  cx.fillStyle='rgba(0,0,0,0.5)'; cx.fillRect(L+4,top+6,Wd-8,14);
  const R=rng(x*7+y);
  for(let yy=top;yy<y+56;yy+=9){ drawStone(cx,R,L,yy,5,9); drawStone(cx,R,L+Wd-5,yy,5,9); }
  for(let xx=L;xx<L+Wd;xx+=11) drawStone(cx,R,xx,top,11,6);
  cx.fillStyle='#c9a24a'; cx.fillRect(L+Wd/2-3,top+1,6,4); cx.fillStyle='#f0d27a'; cx.fillRect(L+Wd/2-2,top+2,4,1);
}

function drawTorchBracket(cx,x,y){
  const tx=x+16,ty=y+24;
  shape(cx,[[tx,ty-12],[tx+3,ty-9],[tx+2.2,ty+4],[tx,ty+6],[tx-2.2,ty+4],[tx-3,ty-9]],steel(cx,tx-3,ty-12,6,18,true),'#ad9361',.3);
  rosette(cx,tx,ty+1,1.4,'#c2a774');rivet(cx,tx,ty-9,.6);rivet(cx,tx,ty+4,.45);
  line(cx,[[tx,ty+1],[tx+3,ty-1],[tx+3,ty-5]],'#302f29',1.4);line(cx,[[tx,ty],[tx+2.6,ty-1.5],[tx+2.6,ty-5]],'#c4a56a',.35);
  const brass=gradient(cx,tx-4,ty,8,0,[[0,'#473d2c'],[.28,'#a28147'],[.5,'#e4c681'],[.75,'#8d7446'],[1,'#302e27']]);
  shape(cx,[[tx-4.5,ty-7],[tx+4.5,ty-7],[tx+2.5,ty-3],[tx-2.5,ty-3]],brass,'#e2c88b',.25);
  for(let i=-2;i<=2;i++)line(cx,[[tx+i*1.4,ty-6.6],[tx+i*.8,ty-3.4]],'#392f22',.25);
  cx.fillStyle='#202a29';cx.beginPath();cx.ellipse(tx,ty-7,4.5,.9,0,0,Math.PI*2);cx.fill();cx.strokeStyle='#dcc082';cx.lineWidth=.35;cx.stroke();
}
function drawRubble(cx,c,r,x,y){
  const R=rng(c*55+r*91);
  for(let i=0;i<14;i++){ const w=1+Math.floor(R()*3), h=1+Math.floor(R()*2); px(cx,x+2+Math.floor(R()*28),y+54-h-Math.floor(R()*2),R()<0.5?'#6a7394':'#8c95b6',w,h); }
  for(let i=0;i<5;i++) px(cx,x+Math.floor(R()*30),y+55,'#3a4262',2,1);

function renderRoomStatic(rx,ry){
  const cv=document.createElement('canvas'); cv.width=SW*DETAIL; cv.height=VIEWH*DETAIL;
  const cx=cv.getContext('2d'); cx.scale(DETAIL,DETAIL);
  cx.fillStyle='#000'; cx.fillRect(0,0,SW,VIEWH);
  const c0=rx*RW, r0=ry*RH;
  const each=(fn)=>{ for(let r=r0-1;r<=r0+RH;r++) for(let c=c0-1;c<=c0+RW;c++) fn(c,r,(c-c0)*TW,(r-r0)*TH); };
  each((c,r,x,y)=>{ if(tile(c,r)!=='#') drawBack(cx,c,r,x,y); });
  torches.forEach(t=>{ if(t.c>=c0-1&&t.c<=c0+RW&&t.r>=r0-1&&t.r<=r0+RH) drawTorchBracket(cx,(t.c-c0)*TW,(t.r-r0)*TH); });
  if(door) { const x=(door.c-c0)*TW, y=(door.r-r0)*TH; if(x>-60&&x<SW+60&&y>-TH&&y<VIEWH+TH) drawDoorFrame(cx,x,y); }
  each((c,r,x,y)=>{ if(tile(c,r)==='#') drawWall(cx,c,r,x,y); });
  each((c,r,x,y)=>{ const t=tile(c,r); if(isFloorT(t)&&t!=='~') drawFloor(cx,c,r,x,y); });
  each((c,r,x,y)=>{ const t=tile(c,r); if(t==='^') drawSpikeHoles(cx,x,y); if(rubble.has(K(c,r))) drawRubble(cx,c,r,x,y); });
  const depth=cx.createLinearGradient(0,0,0,VIEWH);depth.addColorStop(0,'rgba(4,11,24,.19)');depth.addColorStop(.5,'rgba(4,11,24,0)');depth.addColorStop(1,'rgba(3,9,17,.23)');cx.fillStyle=depth;cx.fillRect(0,0,SW,VIEWH);
  for(const t of torches){if(t.c<c0||t.c>=c0+RW||t.r<r0||t.r>=r0+RH)continue;
    const tx=(t.c-c0)*TW+16,ty=(t.r-r0)*TH+16;
    const warmth=cx.createRadialGradient(tx,ty,1,tx,ty,40);warmth.addColorStop(0,'rgba(237,171,89,.13)');warmth.addColorStop(1,'rgba(237,171,89,0)');cx.fillStyle=warmth;cx.fillRect(tx-40,ty-40,80,80);
  }
  return cv;
}
const roomCache=new Map();
function roomCanvas(rx,ry){
  if(cacheDirty){ roomCache.clear(); cacheDirty=false; }
  const k=rx+','+ry; let cv=roomCache.get(k);
  if(!cv){ cv=renderRoomStatic(rx,ry); roomCache.set(k,cv); }
  return cv;
}


/* Architectural ornament is baked once per room, not redrawn every frame. */
function archPath(cx,x,y,w,h){
  cx.beginPath();cx.moveTo(x,y+h);cx.lineTo(x,y+w*.48);
  cx.bezierCurveTo(x,y+w*.2,x+w*.3,y+w*.15,x+w*.5,y);
  cx.bezierCurveTo(x+w*.7,y+w*.15,x+w,y+w*.2,x+w,y+w*.48);
  cx.lineTo(x+w,y+h);cx.closePath();
}

  // A moonlit city visible between distant colonnades.

  for(let layer=0;layer<3;layer++){

    for(const yy of [y+25,y+49]){cx.fillStyle='#64716b';cx.fillRect(xx-.8,yy,4,.7);}
  }
  for(let k=0;k<21;k++){cx.fillStyle='#213b43';cx.fillRect(bx+k*3,y+47,.7,6);}cx.fillStyle='#4d6262';cx.fillRect(bx,y+47,64,.6);
  // Soft diagonal moonbeams are behind all interactive geometry.
  shape(cx,[[bx+38,y+3],[bx+44,y+3],[bx+14,y+55],[bx-8,y+55]],gradient(cx,0,y,0,55,[[0,'rgba(166,214,226,.12)'],[1,'rgba(166,214,226,0)']]));
  cx.restore();
  // Deep carved archivolts with brass inlay.
  for(const [inset,col,width] of [[1,'#080f19',2.8],[2,'#655f53',1.8],[3.3,'#a39573',.45],[4,'#35474c',1.2],[5,'#80958d',.25]]){archPath(cx,bx+inset,y+2+inset*.3,64-inset*2,51-inset*.3);cx.strokeStyle=col;cx.lineWidth=width;cx.stroke();}
  for(let k=0;k<9;k++){const angle=Math.PI+(k/8)*Math.PI,xx=bx+32+Math.cos(angle)*29,yy=y+29+Math.sin(angle)*24;rosette(cx,xx,yy,1.05,'#a39166');}
  // Carved piers, tiled dado and repeating eight-point mosaics.
  for(const xx of [bx,bx+61]){cx.fillStyle=steel(cx,xx,y,3,53,true);cx.fillRect(xx,y,3,53);for(let j=0;j<7;j++)rosette(cx,xx+1.5,y+7+j*6,.8,'#b69a62');}

function drawAtmosphere(rx,ry,t){
  const R=rng(rx*811+ry*107+12),ox=rx*SW,oy=ry*VIEWH;
  g.save();
  for(let i=0;i<55;i++){
    const x=ox+(R()*SW+t*(.4+R()*.8))%SW;
    const y=oy+(R()*VIEWH+Math.sin(t*.4+i)*2+VIEWH)%VIEWH;
    if(tile(colOf(x),Math.floor(y/TH))==='#')continue;
    g.globalAlpha=.08+.17*(.5+.5*Math.sin(t+i));disc(x,y,.18+R()*.3,'#c1cbd6');
  }
  g.globalAlpha=1;
  for(const torch of torches){
    if(Math.floor(torch.c/RW)!==rx||Math.floor(torch.r/RH)!==ry)continue;
    const x=torch.c*TW+16,y=torch.r*TH+16;
    for(let j=0;j<6;j++){
      const age=(t*.38+j/6+torch.seed*.13)%1;
      g.globalAlpha=(1-age)*.7;
      disc(x+Math.sin(age*8+j)*3,y-age*24,.22+(1-age)*.35,j%2?'#ffc476':'#ff743a');
    }
    g.globalAlpha=.045;
    for(let j=0;j<4;j++){const age=(t*.23+j/4)%1;disc(x+Math.sin(age*7+torch.seed)*3,y-8-age*26,1+age*4,'#b6a4a0');}
  }
  g.restore();
}

/* ============================================================

   Torso: up-angle, + = lean forward.  sw = sword down-angle.
   ============================================================ */
const PK=['hx','hy','gnd','tor','head','fT','fS','bT','bS','fU','fF','bU','bF','sw'];
function P(o){ return Object.assign({hx:0,hy:22,gnd:1,tor:0,head:0,fT:0,fS:0,bT:0,bS:0,fU:0,fF:0,bU:0,bF:0,sw:90},o); }
function lerpPose(a,b,t){ const o={}; for(const k of PK) o[k]=a[k]+(b[k]-a[k])*t; return o; }
function keyed(keys,t){ // keys: [[time,pose],...]
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=1;i<keys.length;i++){ if(t<=keys[i][0]){ const [t0,p0]=keys[i-1],[t1,p1]=keys[i]; const u=(t-t0)/(t1-t0); return lerpPose(p0,p1,u*u*(3-2*u)); } }
  return keys[keys.length-1][1];
}
function cycle(keys,ph){
  const n=keys.length,f=((ph%1)+1)%1*n,i=Math.floor(f),u=f-i,o={};
  // Periodic cubic interpolation keeps limb velocity continuous at stride keys.
  for(const k of PK){const a=keys[(i+n-1)%n][k],b=keys[i][k],c=keys[(i+1)%n][k],d=keys[(i+2)%n][k];o[k]=.5*((2*b)+(-a+c)*u+(2*a-5*b+4*c-d)*u*u+(-a+3*b-3*c+d)*u*u*u);}
  o.gnd=clamp(o.gnd,0,1);return o;
}

function skeleton(e,p){
  const d=e.dir;

  const hy=lerp(p.hy,gh,clamp(p.gnd,0,1));
  const hip=[e.x+p.hx*d, e.y-hy];
  const V=(o,a,l)=>[o[0]+Math.sin(a*DEG)*d*l, o[1]+Math.cos(a*DEG)*l];
  const U=(o,a,l)=>[o[0]+Math.sin(a*DEG)*d*l, o[1]-Math.cos(a*DEG)*l];
  const S={d,hip};
  S.kF=V(hip,p.fT,KB.th); S.aF=V(S.kF,p.fS,KB.sh); S.tF=V(S.aF,clamp(p.fS+90,15,120),KB.ft);

  S.neck=U(hip,p.tor,KB.tl); S.sh=U(hip,p.tor,KB.tl-2.5); S.shB=[S.sh[0]-d*1,S.sh[1]];

  S.eF=V(S.sh,p.fU,KB.ua); S.hF=V(S.eF,p.fF,KB.fa);
  S.eB=V(S.shB,p.bU,KB.ua); S.hB=V(S.eB,p.bF,KB.fa);
  S.torDir=[Math.sin(p.tor*DEG)*d,-Math.cos(p.tor*DEG)];

}

const easeContact=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
function solveArm(root,target,bend){
  const dx=target[0]-root[0],dy=target[1]-root[1],distance=Math.hypot(dx,dy)||.001;
  const reach=clamp(distance,.05,KB.ua+KB.fa-.01),ux=dx/distance,uy=dy/distance;
  const along=(KB.ua*KB.ua-KB.fa*KB.fa+reach*reach)/(2*reach),side=Math.sqrt(Math.max(0,KB.ua*KB.ua-along*along));

function applyClimbingContacts(S,e){
  const isClimb=e.st==='climb',isHang=e.st==='hang',isRise=e.st==='rise';
  const ledge=isClimb?e.climb:e.hang;if(!ledge||!(isClimb||isHang||isRise))return;
  const u=isClimb?(ledge.rev?1-clamp(e.t/.95,0,1):clamp(e.t/.95,0,1)):0;
  const arrival=isRise?easeContact((e.t/.14-.5)/.5):1;
  // Both hands bear weight first; the rear hand releases before the lead hand.
  const weights={F:arrival*(1-easeContact((u-.64)/.2)),B:arrival*(1-easeContact((u-.52)/.18))};
  const targets={F:[ledge.edgeX+S.d*1.1,ledge.ledgeY-.15],B:[ledge.edgeX+S.d*4.4,ledge.ledgeY-.35]};
  // Compress the upper body slightly to keep contact without stretching bones.
  let shift=[0,0];

    const root=side==='F'?S.sh:S.shB,t=targets[side],dx=t[0]-root[0]-shift[0],dy=t[1]-root[1]-shift[1],len=Math.hypot(dx,dy),over=Math.max(0,len-15.8)*weights[side];

  }

/* ---------- movement & collision ---------- */
function moveX(e,dx,air){
  if(!dx) return false;
  const r=rowOf(e.y), s=dx>0?1:-1; let nx=e.x+dx, blocked=false;
  const fc=colOf(nx+s*5);
  const wallish=tile(fc,r)==='#'||(air&&fc!==colOf(e.x+s*5)&&ground(fc,r)&&e.y>floorY(r)+0.5);
  if(wallish){ nx=s>0?fc*TW-5.01:(fc+1)*TW+5.01; blocked=true; }
  for(const k in gates){ const gt=gates[k]; if(gt.r!==r||!gateBlocks(gt)) continue; const gx=gt.c*TW+25;
    if(s>0&&e.x+5<=gx-2.9&&nx+5>gx-3){ nx=gx-8.01; blocked=true; }
    if(s<0&&e.x-5>=gx+2.9&&nx-5<gx+3){ nx=gx+8.01; blocked=true; } }
  const others=e===kid?guards.filter(alive):(alive(kid)?[kid]:[]);
  for(const o of others){ if(rowOf(o.y)!==r||o.st==='hang'||o.st==='climb') continue; const od=o.x-e.x;
    if(Math.sign(od)===s&&Math.abs(od)>=13.5&&Math.abs(o.x-nx)<14){ nx=o.x-s*14; blocked=true; } }
  e.x=nx; return blocked;
}
function startFall(e,vx){ setSt(e,'fall'); e.vx=vx; e.vy=0; e.fallStart=e.y; e.jt='fall'; }

  const cl=cc+e.dir; if(!ground(cl,rr)||tile(cl,rr)==='#') return null;
  const edgeX=e.dir>0?cl*TW:(cl+1)*TW; if(Math.abs(e.x-edgeX)>18) return null;

      if(oy<fy+0.01&&ny>=fy&&ground(colOf(e.x),rr)){ e.y=fy; landed(e,rr); return; } }
    if(canGrab&&e===kid){ const oh=oy-54, nh=ny-54;

function nearestFoe(k){

function tryPickup(k){
  const r=rowOf(k.y); const it=items.find(i=>i.r===r&&Math.abs(i.c*TW+16-k.x)<30);
  if(!it) return false; faceTo(k,{x:it.c*TW+16+(it.c*TW+16===k.x?k.dir:0)}); k.item=it; k.itemTaken=false; k.potionDone=false; setSt(k,'pickup'); return true;
}
function takeItem(k,it){
  items.splice(items.indexOf(it),1);
  if(it.type==='s'){ k.sword=true; SFX.pickup(); showMsg('YOU TAKE UP THE SWORD.  J STRIKE   K BLOCK',4,'#ffd860'); }
  else SFX.gulp();
}
function finishPotion(k,it){
  if(it.type==='P'){ k.maxHp++; k.hp=k.maxHp; showMsg('A POTION OF LIFE!  YOUR STRENGTH GROWS',4,'#90ffb0'); flash('80,255,140'); }
  else { k.hp=Math.min(k.maxHp,k.hp+1); showMsg('A HEALING DRAUGHT',2.5,'#ff9aa8'); flash('255,60,60'); }
  SFX.potion();
}
function runJump(k){ k.vx=k.dir*186; k.vy=-165; k.jt='run'; k.fallStart=k.y; setSt(k,'air'); SFX.step(); }
function hurtKid(n,why){
  if(!alive(kid)) return true;
  kid.hp-=n; flash('255,0,0'); SFX.hurt();
  if(kid.hp<=0){ killKid(why); return true; }
  return false;
}
function killKid(why){
  if(kid.st==='dead') return;
  kid.hp=0; kid.deathBy=why; kid.armed=false; kid.vx=0; setSt(kid,'dead'); deaths++;
  if(why==='chomp'||why==='sword'||why==='spikes') blood(kid.x,kid.y-24,-kid.dir,18);
  setTimeout(()=>SFX.death(),350);
}
function flash(col){ flashT=0.25; flashCol=col; }
function atDoor(k){ return door&&door.open>0.95&&rowOf(k.y)===door.r&&Math.abs(k.x-(door.c*TW+16))<18; }
function nearBlade(k){ const c=colOf(k.x), r=rowOf(k.y); for(const cc of [c-1,c,c+1]) if(tile(cc,r)==='/'&&Math.abs(k.x-(cc*TW+18))<22) return true; return false; }
function spikeCheck(k){
  const c=colOf(k.x), r=rowOf(k.y), key=K(c,r), sp=spikes[key];
  if(!sp){ k.spikeSafe=null; return false; }
  if(k.spikeSafe===key) return false;
  const lx=k.x-c*TW; if(lx>6&&lx<26){ sp.out=1; sp.hold=1.5; sp.bloody=true; SFX.impale(); killKid('spikes'); return true; }
  return false;
}

function kidUpdate(dt){
  const k=kid; k.t+=dt; if(k.invuln>0) k.invuln-=dt;
  const d=k.dir, fw=d>0?keys.right:keys.left, bk=d>0?keys.left:keys.right;
  const fwP=d>0?pressed.right:pressed.left, bkP=d>0?pressed.left:pressed.right;
  const foe=nearestFoe(k);
  switch(k.st){
  case 'crouchUp': if(k.t>0.7) setSt(k,'stand'); break;
  case 'stand':
    k.vx=0; if(checkFall(k)) break;
    if(k.sword&&foe&&foe.dist<100){ faceTo(k,foe.e); setSt(k,'drawSword'); SFX.draw(); break; }
    if(pressed.jump){ setSt(k,'jprep'); break; }
    if(pressed.up){ if(atDoor(k)){ setSt(k,'exit'); k.exitFrom=k.x; SFX.win(); break; } setSt(k,'uprep'); break; }
    if(keys.down){ if(tryClimbDown(k)) break; setSt(k,'crouch'); break; }
    if(pressed.take&&tryPickup(k)) break;
    if(pressed.strike){ if(k.sword){ setSt(k,'drawSword'); SFX.draw(); } else { setSt(k,'punch'); SFX.swish(); } break; }
    if(bk){ setSt(k,'turn'); break; }
    if(fw){ if(keys.shift) startStep(k); else { setSt(k,'run'); k.runPh=0; k.vx=0; } }
    break;
  case 'turn':
    if(k.t>=0.07&&!k.flag){ k.dir*=-1; k.flag=true; }
    if(k.t>0.14){ const f2=k.dir>0?keys.right:keys.left; if(f2&&!keys.shift){ setSt(k,'run'); k.runPh=0; } else setSt(k,'stand'); }
    break;
  case 'run': {
    k.vx=d*Math.min(RUNV,Math.abs(k.vx)+RUNV*dt*(k.t<0.15?3:7));
    if(pressed.jump||pressed.up){ runJump(k); break; }
    if(bk){ setSt(k,'runTurn'); break; }
    if(!fw||keys.shift){ setSt(k,'stop'); break; }
    if(keys.down){ k.vx=0; setSt(k,'crouch'); break; }
    const oph=k.runPh; const blocked=moveX(k,k.vx*dt);
    if(k.t>0.15) k.runPh+=Math.abs(k.vx)*dt/78;
    if(Math.floor(oph*2)!==Math.floor(k.runPh*2)) SFX.step();
    if(blocked){ k.vx=0; SFX.bump(); setSt(k,'bump'); break; }
    if(spikeCheck(k)) break;
    if(k.sword&&foe&&foe.dist<90&&!nearBlade(k)){ faceTo(k,foe.e); setSt(k,'drawSword'); SFX.draw(); break; }
    checkFall(k); break; }
  case 'stop': {
    const sp=Math.max(0,Math.abs(k.vx)-RUNV*dt*5); k.vx=d*sp; if(moveX(k,k.vx*dt)) k.vx=0;
    if(spikeCheck(k)) break; if(checkFall(k)) break;
    if(pressed.jump&&k.t<0.12){ runJump(k); break; }
    if(k.t>0.26) setSt(k,'stand'); break; }
  case 'runTurn': {
    const sp=Math.max(0,Math.abs(k.vx)-RUNV*dt*5); k.vx=d*sp; moveX(k,k.vx*dt);
    if(checkFall(k)) break;
    if(k.t>0.24){ k.dir*=-1; k.vx=0; const f2=k.dir>0?keys.right:keys.left; if(f2){ setSt(k,'run'); } else setSt(k,'stand'); }
    break; }
  case 'bump': if(k.t<0.1) moveX(k,-d*30*dt); if(k.t>0.3) setSt(k,'stand'); break;
  case 'step': {
    const u=Math.min(1,k.t/0.42), nx=lerp(k.stepFrom,k.stepTo,u*u*(3-2*u));
    moveX(k,nx-k.x); const key=K(colOf(k.x),rowOf(k.y)); if(spikes[key]) k.spikeSafe=key;
    if(k.t>=0.42){ setSt(k,'stand'); checkFall(k); } break; }
  case 'teeter': if(k.t>0.6) setSt(k,'stand'); break;
  case 'crouch':
    k.vx=0; if(checkFall(k)) break;
    if(pressed.take&&tryPickup(k)) break;
    if(!keys.down){ setSt(k,'crouchUp2'); break; }
    if(fwP) setSt(k,'crouchHop'); else if(bkP) k.dir*=-1;
    break;
  case 'crouchHop': {
    if(k.t<0.22) moveX(k,d*40*dt);
    const key=K(colOf(k.x),rowOf(k.y)); if(spikes[key]) k.spikeSafe=key;
    if(checkFall(k)) break; if(k.t>0.3){ setSt(k,'crouch'); k.t=0.2; } break; }
  case 'crouchUp2': if(k.t>0.18) setSt(k,'stand'); break;
  case 'jprep':
    if(k.t>=0.16){ k.vx=d*158; k.vy=-128; k.jt='stand'; k.fallStart=k.y; setSt(k,'air'); SFX.step(); }
    break;
  case 'uprep':
    if(k.t>=0.14){
      const L=findLedgeUp(k);
      if(L){ k.dir=L.dir; k.hang=L; k.from={x:k.x,y:k.y}; setSt(k,'rise'); SFX.step(); }
      else { const cc=colOf(k.x), r=rowOf(k.y), ceil=tile(cc,r-1)!==' ';
        if(ceil&&tile(cc,r-1)==='~') triggerLoose(cc,r-1);
        k.vx=0; k.vy=ceil?-95:-150; k.jt='up'; k.fallStart=k.y; k.ceil=ceil; setSt(k,'air'); }
    }
    break;
  case 'rise': {
    const u=Math.min(1,k.t/0.14); k.x=lerp(k.from.x,k.hang.edgeX-k.dir*6,u); k.y=lerp(k.from.y,k.hang.ledgeY+56,u);
    if(u>=1){ setSt(k,'hang'); SFX.grunt(); if(tile(k.hang.cl,k.hang.rr)==='~') triggerLoose(k.hang.cl,k.hang.rr); }
    break; }
  case 'air': case 'fall':
    if(k.jt==='up'&&k.ceil&&k.vy>-10&&!k.flag){ k.flag=true; SFX.bump(); }
    airPhysics(k,dt,k.st==='air'&&k.jt!=='up'||keys.up||keys.shift);
    break;
  case 'hang': {
    const H=k.hang; k.vx=0;
    if(!ground(H.cl,H.rr)){ startFall(k,0); break; }
    if((pressed.up||pressed.jump||(keys.up&&k.t>0.3))&&canClimb(H)){ k.climb=Object.assign({},H,{rev:false}); setSt(k,'climb'); SFX.grunt(); break; }
    if(pressed.down){ k.x-=k.dir*3; startFall(k,0); }
    break; }
  case 'climb': {
    const C=k.climb, DUR=0.95, u=Math.min(1,k.t/DUR), uu=C.rev?1-u:u;
    const x0=C.edgeX-k.dir*6, x1=C.edgeX+k.dir*8;
    k.x=lerp(x0,x1,curve([[0,0],[0.3,0.08],[0.55,0.55],[0.8,1],[1,1]],uu));
    k.y=C.ledgeY+curve([[0,56],[0.3,30],[0.55,0],[0.8,0],[1,0]],uu);
    if(!ground(C.cl,C.rr)){ startFall(k,0); break; }
    if(u>=1){ if(C.rev){ k.x=x0; k.y=C.ledgeY+56; k.hang=C; setSt(k,'hang'); } else { k.x=x1; k.y=C.ledgeY; setSt(k,'stand'); } }
    break; }
  case 'land': if(checkFall(k)) break; if(k.t>0.22) setSt(k,'stand'); break;
  case 'landHard': if(k.t>0.8) setSt(k,'stand'); break;
  case 'pickup': {
    const it=k.item, isS=it.type==='s';
    if(k.t>0.38&&!k.itemTaken){ k.itemTaken=true; takeItem(k,it); }
    if(!isS&&k.t>1.35&&!k.potionDone){ k.potionDone=true; finishPotion(k,it); }
    if(k.t>(isS?1.6:1.9)){ k.item=null; setSt(k,'stand'); }
    break; }
  case 'drawSword': if(k.t>0.12) k.armed=true; if(k.t>0.3) setSt(k,'engarde'); break;
  case 'engarde':
    k.vx=0; if(checkFall(k)) break;
    if(!foe||foe.dist>150){ k.calm+=dt; if(k.calm>0.9){ setSt(k,'sheathe'); break; } } else { k.calm=0; faceTo(k,foe.e); }
    if(pressed.down){ setSt(k,'sheathe'); break; }
    if(pressed.strike){ setSt(k,'strike'); SFX.swish(); break; }
    if(pressed.block||pressed.up){ setSt(k,'block'); break; }
    if(fwP||fw){ if(!foe||foe.dist>22) setSt(k,'advance'); break; }
    if(bkP||bk){ setSt(k,'retreat'); break; }
    break;
  case 'advance':
    if(pressed.strike){ setSt(k,'strike'); SFX.swish(); break; }
    if(pressed.block||pressed.up){ setSt(k,'block'); break; }
    if(k.t<0.2) moveX(k,d*56*dt); if(spikeCheck(k)) break; if(checkFall(k)) break; if(k.t>0.26) setSt(k,'engarde'); break;
  case 'retreat':
    if(pressed.block||pressed.up){ setSt(k,'block'); break; }
    if(k.t<0.2) moveX(k,-d*56*dt); if(checkFall(k)) break; if(k.t>0.26) setSt(k,'engarde'); break;
  case 'strike':
    if(!k.hitDone&&k.t>0.15){ k.hitDone=true; resolveStrike(k); }
    if(k.t>0.42) setSt(k,'engarde'); break;
  case 'block':
    if(k.t>0.14&&pressed.strike){ setSt(k,'strike'); SFX.swish(); break; }
    if(k.t>0.36) setSt(k,'engarde'); break;
  case 'sheathe': if(k.t>0.3){ k.armed=false; setSt(k,'stand'); } break;
  case 'hurt':
    if(k.t<0.15) moveX(k,-d*50*dt); if(checkFall(k)) break;
    if(k.t>0.36) setSt(k,k.armed?'engarde':'stand'); break;
  case 'punch':
    if(!k.hitDone&&k.t>0.13){ k.hitDone=true; resolvePunch(k); }
    if(k.t>0.34) setSt(k,'stand'); break;
  case 'exit': {
    const cx=door.c*TW+16;
    if(k.t<0.4) k.x=lerp(k.exitFrom,cx,k.t/0.4);
    else { const u=Math.min(1,(k.t-0.4)/1.6); k.x=cx+u*12; k.y=floorY(door.r)-u*32; }
    if(k.t>2.2&&gameState==='play'){ gameState='win'; }
    break; }
  case 'dead': break;
  }
}
function curve(pts,t){ for(let i=1;i<pts.length;i++) if(t<=pts[i][0]){ const [a,va]=pts[i-1],[b,vb]=pts[i]; const u=(t-a)/(b-a); return va+(vb-va)*u*u*(3-2*u); } return pts[pts.length-1][1]; }

/* ---------- combat ---------- */
function resolveStrike(att){
  const def=att===kid?(nearestFoe(kid)||{}).e:kid;
  if(!def||!alive(def)||barrierBetween(att,def)) return;
  const dx=def.x-att.x; if(Math.abs(dx)>2&&Math.sign(dx)!==att.dir) return;
  if(Math.abs(dx)>40||rowOf(def.y)!==rowOf(att.y)) return;
  if(def.st==='hang'||def.st==='climb'||def.st==='fall'||def.st==='air') return;
  const tipX=att.x+att.dir*Math.min(28,Math.abs(dx)), tipY=att.y-30;
  const blocking=def.st==='block'&&def.t<0.34&&def.dir===-att.dir;
  if(blocking){ SFX.clash(); sparks(tipX,tipY); if(att!==kid){ setSt(att,'stagger'); } else { setSt(att,'hurt'); att.t=0.18; } return; }
  if(def===kid){
    if(kid.invuln>0) return; kid.invuln=0.35; SFX.hit(); blood(kid.x,kid.y-28,att.dir,8);
    if(!hurtKid(kid.armed?1:2,'sword')) setSt(kid,'hurt');
  } else {
    def.hp--; SFX.hit(); blood(def.x,def.y-28,att.dir,8);
    if(def.hp<=0){ setSt(def,'die'); SFX.grunt(); if(def.kind==='captain') showMsg('THE CAPTAIN OF THE GUARD FALLS',3.5,'#ffd860'); }
    else setSt(def,'hurt');
  }
}
function resolvePunch(k){
  const f=nearestFoe(k); if(!f||f.dist>24||Math.sign(f.e.x-k.x)!==k.dir) return;
  const e=f.e;
  if(e.st==='block'||Math.random()<0.35){ SFX.bump(); setSt(e,'block'); return; }
  SFX.punch(); e.hp--; blood(e.x,e.y-34,k.dir,4);
  if(e.hp<=0){ setSt(e,'die'); SFX.grunt(); } else setSt(e,'hurt');
}
// a closed gate or a blade trap between two fighters stops the fight
function barrierBetween(a,b){
  const r=rowOf(a.y); if(rowOf(b.y)!==r) return false;
  const c0=Math.min(colOf(a.x),colOf(b.x)), c1=Math.max(colOf(a.x),colOf(b.x));
  for(let c=c0;c<=c1;c++){
    if(tile(c,r)==='/'){ const cx=c*TW+18; if((a.x-cx)*(b.x-cx)<=0) return true; }
    const gt=gateAt(c,r); if(gt&&gateBlocks(gt)){ const gx=c*TW+25; if((a.x-gx)*(b.x-gx)<=0) return true; }
  }
  return false;
}
function safeAhead(e,s){
  const x=e.x+s*16, c=colOf(x), r=rowOf(e.y), t=tile(c,r);
  if(!ground(c,r)||t==='#'||t==='^'||t==='/') return false;
  if(tile(c-1,r)==='/'||tile(c+1,r)==='/') return false; // keep clear of blade traps
  for(const k in gates){ const gt=gates[k]; if(gt.r===r&&gateBlocks(gt)){ const gx=gt.c*TW+25; if((e.x-gx)*(x-gx)<=0) return false; } }
  return true;
}
function guardUpdate(e,dt){
  e.t+=dt;
  if(e.st==='dead') return;
  if(e.st==='die'){ if(e.t>1) setSt(e,'dead'); return; }
  if(e.st==='fall'){ airPhysics(e,dt,false); return; }
  const kidOk=alive(kid)&&GROUND_ST.has(kid.st);
  const dx=kid.x-e.x, dist=Math.abs(dx);
  const sees=kidOk&&rowOf(kid.y)===rowOf(e.y)&&dist<150&&sameRoom(e,kid)&&!barrierBetween(e,kid);
  e.cool-=dt;
  switch(e.st){
  case 'idle': if(sees){ faceTo(e,kid); setSt(e,'engarde'); SFX.draw(); } break;
  case 'engarde': {
    if(checkFall(e)) break;
    if(!sees) break;
    faceTo(e,kid);
    if(kid.st==='strike'&&kid.t<0.1&&dist<46){ if(!e.reacted){ e.reacted=true; if(Math.random()<e.block){ setSt(e,'block'); break; } } }
    else if(kid.st!=='strike') e.reacted=false;
    if(e.cool<=0){
      if(dist>34){ if(safeAhead(e,e.dir)) setSt(e,'advance'); e.cool=0.12+Math.random()*0.25; }
      else if(dist<19){ if(safeAhead(e,-e.dir)) setSt(e,'retreat'); e.cool=0.3; }
      else if(Math.random()<e.aggr){ setSt(e,'strike'); SFX.swish(); e.cool=e.react+Math.random()*0.55; }
      else { e.cool=0.2+Math.random()*0.35; if(Math.random()<0.25&&safeAhead(e,-e.dir)) setSt(e,'retreat'); }
    }
    break; }
  case 'advance': if(e.t<0.2) moveX(e,e.dir*50*dt); if(e.t>0.28) setSt(e,'engarde'); break;
  case 'retreat': if(e.t<0.2) moveX(e,-e.dir*50*dt); if(checkFall(e)) break; if(e.t>0.28) setSt(e,'engarde'); break;
  case 'strike': if(!e.hitDone&&e.t>0.32){ e.hitDone=true; resolveStrike(e); } if(e.t>0.6) setSt(e,'engarde'); break;
  case 'block': if(e.t>0.34){ if(Math.random()<0.45&&sees&&dist<40){ setSt(e,'strike'); SFX.swish(); } else setSt(e,'engarde'); } break;
  case 'hurt': if(e.t<0.15) moveX(e,-e.dir*60*dt); if(checkFall(e)) break; if(e.t>0.4) setSt(e,'engarde'); break;
  case 'stagger': if(e.t<0.15) moveX(e,-e.dir*40*dt); if(checkFall(e)) break; if(e.t>0.5) setSt(e,'engarde'); break;
  }
}

/* ---------- traps & mechanisms ---------- */
function onTile(e,c,r){ return alive(e)&&GROUND_ST.has(e.st)&&colOf(e.x)===c&&rowOf(e.y)===r; }
function pressButton(b){
  const v=inRoomVol(b.c*TW+16,floorY(b.r)); if(v) SFX.click();
  for(const k in gates){ const gt=gates[k]; if(gt.id!==b.id) continue;
    if(b.drop){ if(gt.p<1) gt.mode='slam'; }
    else { gt.mode='open'; gt.hold=GATE_HOLD[gt.id]||8; } }
  if(!b.drop&&door&&b.id===5&&!door.opening){ door.opening=true; SFX.door(); shake(0.6); showMsg('SOMEWHERE ABOVE, THE GREAT DOOR GRINDS OPEN',4,'#ffd860'); }
}
function triggerLoose(c,r){ const L=looses[K(c,r)]; if(L&&!L.trig){ L.trig=true; L.t=0; } }
function updateTraps(dt){
  for(const k in buttons){ const b=buttons[k];
    let occ=b.stuck||onTile(kid,b.c,b.r);
    if(occ&&!b.pressed){ b.pressed=true; pressButton(b); } else if(!occ&&b.pressed) b.pressed=false;
    if(occ&&!b.drop) for(const q in gates){ const gt=gates[q]; if(gt.id===b.id&&gt.mode==='hold') gt.hold=GATE_HOLD[gt.id]||8; }
  }
  for(const k in gates){ const gt=gates[k], v=inRoomVol(gt.c*TW+16,floorY(gt.r)); gt.tick-=dt;
    if(gt.mode==='open'){ gt.p-=dt*1.1; if(gt.tick<=0){ gt.tick=0.07; if(v) SFX.gateTick(v); } if(gt.p<=0){ gt.p=0; gt.mode='hold'; } }
    else if(gt.mode==='hold'){ gt.hold-=dt; if(gt.hold<=0) gt.mode='close'; }
    else if(gt.mode==='close'){ gt.p+=dt*0.13; if(gt.tick<=0){ gt.tick=0.32; if(v) SFX.gateTick(v*0.8); } if(gt.p>=1){ gt.p=1; gt.mode='shut'; if(v) SFX.bump(); } }
    else if(gt.mode==='slam'){ gt.p+=dt*4; if(gt.p>=1){ gt.p=1; gt.mode='shut'; if(v){ SFX.gateSlam(); shake(0.2);} } }
    if(gateBlocks(gt)){ const gx=gt.c*TW+25; for(const e of [kid,...guards]){ if(!alive(e)||rowOf(e.y)!==gt.r) continue; if(Math.abs(e.x-gx)<8) e.x=e.x<gx?gx-8.01:gx+8.01; } }
  }
  if(door&&door.opening&&door.open<1){ door.open=Math.min(1,door.open+dt*0.42); }
  for(const k in looses){ const L=looses[k];
    if(onTile(kid,L.c,L.r)||(kid.st==='hang'&&kid.hang&&kid.hang.cl===L.c&&kid.hang.rr===L.r)) triggerLoose(L.c,L.r);
    if(!L.trig){ L.wob=Math.max(0,L.wob-dt); if(alive(kid)&&rowOf(kid.y)===L.r&&Math.abs(kid.x-(L.c*TW+16))<70&&Math.random()<dt*0.6){ L.wob=0.18; if(inRoomVol(L.c*TW,floorY(L.r))) SFX.shake(); } continue; }
    L.t+=dt; if(Math.floor(L.t*12)!==Math.floor((L.t-dt)*12)) SFX.shake();
    if(L.t>0.5){ T[L.r][L.c]=' '; delete looses[k]; cacheDirty=true; fallers.push({c:L.c,y:floorY(L.r),vy:0,hit:false}); }
  }
  for(let i=fallers.length-1;i>=0;i--){ const f=fallers[i];
    f.vy=Math.min(f.vy+GRAV*dt,430); const ny=f.y+f.vy*dt;
    if(!f.hit&&alive(kid)&&colOf(kid.x)===f.c&&ny>kid.y-44&&f.y<kid.y-10){ f.hit=true; SFX.hit();
      if(kid.st==='hang'||kid.st==='climb') { startFall(kid,0); } if(!hurtKid(1,'rock')&&GROUND_ST.has(kid.st)) setSt(kid,'landHard'); }
    let done=false;
    for(const rr of [rowOf(ny)-1,rowOf(ny)]){ const fy=floorY(rr); if(f.y<fy&&ny>=fy&&ground(f.c,rr)){
      const key=K(f.c,rr); rubble.add(key); cacheDirty=true; done=true;
      if(inRoomVol(f.c*TW,fy)){ SFX.crash(); shake(0.3); } dust(f.c*TW,fy);
      if(buttons[key]){ buttons[key].stuck=true; } if(looses[key]) triggerLoose(f.c,rr);
      break; } }
    if(done||ny>LH*TH+100) fallers.splice(i,1); else f.y=ny;
  }
  for(const k in spikes){ const sp=spikes[k], cx=sp.c*TW+16;
    const near=alive(kid)&&Math.abs(kid.x-cx)<40&&(rowOf(kid.y)===sp.r||(rowOf(kid.y)===sp.r-1&&!GROUND_ST.has(kid.st)));
    if(near){ if(sp.out<0.1&&sp.hold<=0&&inRoomVol(cx,floorY(sp.r))) SFX.spikes(); sp.hold=1.2; }
    if(sp.hold>0){ sp.hold-=dt; sp.out=Math.min(1,sp.out+dt*9); } else sp.out=Math.max(0,sp.out-dt*1.5);
  }
  for(const k in choppers){ const ch=choppers[k], cx=ch.c*TW+18;
    ch.active=sameRoom({x:cx,y:floorY(ch.r)},kid)&&kid.st!=='dead'||ch.close>0;
    if(!ch.active){ ch.close=0; continue; }
    const PER=1.7, o=ch.ph%PER; ch.ph+=dt; const ph=ch.ph%PER;
    if(ph<o&&inRoomVol(cx,floorY(ch.r))) SFX.chomp();
    ch.close=ph<0.1?ph/0.1:ph<0.32?1:ph<0.6?1-(ph-0.32)/0.28:0;
    if(ch.close>0.6&&alive(kid)&&rowOf(kid.y)===ch.r&&Math.abs(kid.x-cx)<8&&kid.st!=='hang'&&kid.st!=='climb'){ ch.bloody=true; killKid('chomp'); SFX.impale(); }
  }
}

/* ---------- particles ---------- */
function addP(x,y,vx,vy,life,col,grav=320){ particles.push({x,y,vx,vy,life,max:life,col,grav}); }
function blood(x,y,dir,n){ for(let i=0;i<n;i++) addP(x,y,dir*(15+Math.random()*70),-30-Math.random()*70,0.7,Math.random()<0.5?'#c41010':'#7a0606'); }
function sparks(x,y){ for(let i=0;i<14;i++) addP(x,y,(Math.random()-0.5)*190,(Math.random()-0.7)*150,0.3,Math.random()<0.5?'#ffffff':'#ffd040',120); }
function dust(x,y){ for(let i=0;i<22;i++) addP(x+Math.random()*32,y-Math.random()*4,(Math.random()-0.5)*70,-Math.random()*60,0.9,Math.random()<0.5?'#8a93b3':'#5a6384',180); }
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt; if(p.life<=0){ particles.splice(i,1); continue; }
    p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  for(const t of torches){ if(Math.random()<dt*1.2&&inRoomVol(t.c*TW,t.r*TH)===1) addP(t.c*TW+16+(Math.random()-0.5)*4,t.r*TH+8,(Math.random()-0.5)*8,-18-Math.random()*16,1+Math.random(),Math.random()<0.5?'#ff9a30':'#ffd060',-6); }
}

function kidPose(k){
  const t=k.t;
  switch(k.st){
  case 'stand': return lerpPose(PS.stand,PS.breathe,(Math.sin(clock*2.2)+1)/2);
  case 'crouchUp': return keyed([[0,PS.crouch],[0.35,PS.crouch],[0.7,PS.stand]],t);
  case 'turn': return t<0.07?lerpPose(PS.stand,PS.turn,t/0.07):lerpPose(PS.turn,PS.stand,Math.min(1,(t-0.07)/0.07));
  case 'run': return t<0.15?lerpPose(PS.stand,PS.runStart,t/0.15):t<0.25?lerpPose(PS.runStart,cycle(RUNC,k.runPh),(t-0.15)/0.1):cycle(RUNC,k.runPh);
  case 'stop': return keyed([[0,cycle(RUNC,k.runPh)],[0.08,PS.skid],[0.2,PS.skid],[0.26,PS.stand]],t);
  case 'runTurn': return keyed([[0,cycle(RUNC,k.runPh)],[0.06,PS.skid],[0.2,PS.skid],[0.24,PS.turn]],t);
  case 'bump': return keyed([[0,PS.hurt],[0.3,PS.stand]],t);
  case 'step': return keyed([[0,PS.stand],[0.21,PS.stepMid],[0.42,PS.stand]],t);
  case 'teeter': return keyed([[0,PS.stand],[0.15,PS.teeter],[0.45,PS.teeter],[0.6,PS.stand]],t);
  case 'crouch': return t<0.12?lerpPose(PS.stand,PS.crouch,t/0.12):PS.crouch;
  case 'crouchHop': return keyed([[0,PS.crouch],[0.12,PS.hop],[0.3,PS.crouch]],t);
  case 'crouchUp2': return lerpPose(PS.crouch,PS.stand,Math.min(1,t/0.18));
  case 'jprep': case 'uprep': return keyed([[0,PS.stand],[0.15,PS.jprep]],t);
  case 'air': {
    if(k.jt==='up') return keyed([[0,PS.jprep],[0.1,PS.reach]],t);
    const drop=k.y-k.fallStart, base=k.jt==='run'?PS.rjump:PS.sjump;
    const start=keyed([[0,PS.jprep],[0.08,base]],t);
    return drop>16?lerpPose(base,PS.fall,clamp((drop-16)/40,0,1)):start; }
  case 'fall': return keyed([[0,PS.land],[0.15,PS.fall]],t);
  case 'rise': return lerpPose(PS.jprep,PS.hang,clamp(t/0.14,0,1));
  case 'hang': return lerpPose(PS.hang,PS.hang2,(Math.sin(t*3)+1)/2);
  case 'climb': { const u=Math.min(1,t/0.95), uu=k.climb.rev?1-u:u; return keyed([[0,PS.hang],[0.3,PS.pull],[0.55,PS.knee],[0.8,PS.crouch],[1,PS.stand]],uu); }
  case 'land': return keyed([[0,PS.land],[0.22,PS.stand]],t);
  case 'landHard': return keyed([[0,PS.crouch],[0.5,PS.crouch],[0.8,PS.stand]],t);
  case 'pickup': {
    const s=k.item&&k.item.type==='s';
    const p=s?keyed([[0,PS.stand],[0.3,PS.grab],[0.45,PS.grab],[0.8,PS.raise],[1.25,PS.raise],[1.6,PS.stand]],t)
             :keyed([[0,PS.stand],[0.3,PS.grab],[0.45,PS.grab],[0.75,PS.drink],[1.5,PS.drink],[1.9,PS.stand]],t);
    const o=Object.assign({},p); if(s&&t>0.38&&t<1.45) o.showSword=true; if(!s&&t>0.38&&t<1.45) o.showPotion=k.item.type; return o; }
  case 'drawSword': { const o=Object.assign({},keyed([[0,PS.stand],[0.3,PS.engarde]],t)); o.showSword=t>0.1; return o; }
  case 'engarde': return lerpPose(PS.engarde,PS.engarde2,(Math.sin(clock*4)+1)/2*0.35);
  case 'advance': return keyed([[0,PS.engarde],[0.12,PS.engarde2],[0.26,PS.engarde]],t);
  case 'retreat': return keyed([[0,PS.engarde],[0.12,PS.retreatMid],[0.26,PS.engarde]],t);
  case 'strike': return keyed([[0,PS.engarde],[0.08,PS.swWind],[0.16,PS.swHit],[0.3,PS.swHit],[0.42,PS.engarde]],t);
  case 'block': return keyed([[0,PS.engarde],[0.05,PS.block],[0.28,PS.block],[0.36,PS.engarde]],t);
  case 'sheathe': { const o=Object.assign({},keyed([[0,PS.engarde],[0.3,PS.stand]],t)); o.showSword=t<0.2; return o; }
  case 'hurt': return keyed([[0,PS.hurt],[0.2,PS.hurt],[0.36,k.armed?PS.engarde:PS.stand]],t);
  case 'punch': return keyed([[0,PS.fists],[0.07,PS.pWind],[0.13,PS.pHit],[0.24,PS.pHit],[0.34,PS.stand]],t);
  case 'exit': return t<0.4?cycle([PS.stand,PS.walk2],t*3):cycle([PS.stand,PS.walk2,PS.stand,PS.stepMid],t*1.6);
  case 'dead':
    if(k.deathBy==='spikes') return PS.impaled;
    return keyed([[0,PS.hurt],[0.25,PS.kneel],[0.7,PS.lying]],t);
  }
  return PS.stand;
}
function guardPose(e){
  const t=e.t;
  switch(e.st){
  case 'idle': return lerpPose(PS.gIdle,PS.breathe,0.15+0.15*Math.sin(clock*2));
  case 'engarde': return lerpPose(PS.engarde,PS.engarde2,(Math.sin(clock*3.3+e.x)+1)/2*0.35);
  case 'advance': return keyed([[0,PS.engarde],[0.12,PS.engarde2],[0.28,PS.engarde]],t);
  case 'retreat': return keyed([[0,PS.engarde],[0.12,PS.retreatMid],[0.28,PS.engarde]],t);
  case 'strike': return keyed([[0,PS.engarde],[0.2,PS.swWind],[0.26,PS.swWind],[0.32,PS.swHit],[0.44,PS.swHit],[0.6,PS.engarde]],t);
  case 'block': return keyed([[0,PS.engarde],[0.05,PS.block],[0.26,PS.block],[0.34,PS.engarde]],t);
  case 'hurt': case 'stagger': return keyed([[0,PS.hurt],[0.25,PS.hurt],[0.45,PS.engarde]],t);
  case 'fall': return PS.fall;
  case 'die': return keyed([[0,PS.hurt],[0.35,PS.kneel],[0.9,PS.lying]],t);
  case 'dead': return PS.lying;
  }
  return PS.engarde;
}

const healthDisplay=new WeakMap();
function healthBar(e,x,y,w,title,color){
  const hp=clamp(e.hp,0,e.maxHp),target=hp/e.maxHp,now=performance.now();
  let state=healthDisplay.get(e);if(!state){state={value:target,trail:target,time:now};healthDisplay.set(e,state);}
  const dt=Math.min(.1,(now-state.time)/1000);state.time=now;
  state.value=lerp(state.value,target,1-Math.exp(-dt*12));state.trail=lerp(state.trail,target,1-Math.exp(-dt*2.3));
  label(title,x,y,4.3,'#9faebe');label(hp+' / '+e.maxHp,x+w,y,4.4,'#ede5d4','right');
  roundPanel(x,y+7,w,5.2,2.6,'#080e18','#445364');

  g.fillStyle='#c4a66e';g.fillRect(x+.7,y+7.7,(w-1.4)*state.trail,3.8);
  const fill=g.createLinearGradient(x,y+7,x,y+12);fill.addColorStop(0,color);fill.addColorStop(1,e===kid?'#197968':'#743659');g.fillStyle=fill;g.fillRect(x+.7,y+7.7,(w-1.4)*state.value,3.8);
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x+1,y+8,(w-2)*state.value,.5);
  for(let i=1;i<e.maxHp;i++){g.fillStyle='rgba(7,17,26,.55)';g.fillRect(x+w*i/e.maxHp,y+8,.4,3.6);}g.restore();

}

    drawHero(kid,kidPose(kid),clock); g.restore();
  } else if(!(kid.invuln>0&&Math.floor(clock*20)%2&&kid.st!=='dead')) {
    const p=kidPose(kid); drawHero(kid,p,clock);
    if(p.showPotion){const S=skeleton(kid,p);drawFlask(S.hF[0],S.hF[1],p.showPotion==='P',clock,.55);}

  g.globalAlpha=1;
  // foreground (pillars already drawn behind characters)

}

    g.save();g.font='600 5.5px "Segoe UI", Arial, sans-serif';g.textBaseline='middle';g.textAlign='center';g.fillStyle='rgba(60,40,15,.55)';g.fillText('SPACE   Begin your escape',160,175+17/2+1);g.fillStyle='#1a2432';g.fillText('SPACE   Begin your escape',160,175+17/2+.3);g.restore();
  }
  label('ESC  Pause     R  Restart     M  Sound',160,198,4.2,'#8b9dab','center');
}

function drawMenu(opts,sel,y,gap){
  opts.forEach((o,i)=>{const on=i===sel,yy=y+i*gap,mx=112,my=yy-2,mw=96,mh=10;
    g.save(); g.shadowColor='rgba(0,0,0,.45)'; g.shadowBlur=4; g.shadowOffsetY=1;
    const bg=g.createLinearGradient(0,my,0,my+mh);
    if(on){ bg.addColorStop(0,'rgba(120,95,55,.85)'); bg.addColorStop(.5,'rgba(70,55,32,.9)'); bg.addColorStop(1,'rgba(45,35,20,.9)'); }
    else { bg.addColorStop(0,'rgba(25,38,52,.9)'); bg.addColorStop(1,'rgba(10,18,28,.9)'); }
    g.beginPath(); g.roundRect(mx,my,mw,mh,2); g.fillStyle=bg; g.fill(); g.restore();
    g.save(); g.beginPath(); g.roundRect(mx,my,mw,mh,2); g.clip();
    g.fillStyle=on?'rgba(255,240,200,.22)':'rgba(255,255,255,.06)'; g.fillRect(mx+1,my+.7,mw-2,.9);
    g.fillStyle='rgba(0,0,0,.3)'; g.fillRect(mx+1,my+mh-1.5,mw-2,.8);
    g.restore();
    g.beginPath(); g.roundRect(mx,my,mw,mh,2); g.strokeStyle=on?'#c8a76a':'rgba(120,140,160,.25)'; g.lineWidth=on?.7:.4; g.stroke();
    g.save();g.font=fontFace(1);g.textBaseline='middle';g.textAlign='center';
    if(on){ g.fillStyle='rgba(0,0,0,.6)'; g.fillText(o,160,my+mh/2+.9); g.fillStyle='#f7e5bd'; }
    else g.fillStyle='#a4b3c1';
    g.fillText(o,160,my+mh/2+.3);g.restore();});
}

function renderWin(){
  g.fillStyle='rgba(0,0,0,0.75)'; g.fillRect(0,0,SW,SH);
  drawTextC('FREEDOM',SW/2,48,'#ffd860',4,'#7a1a0a');
  drawTextC('YOU ESCAPED THE SULTAN\'S DUNGEON',SW/2,80,'#e8e2cc',1);
  const m=Math.floor(playTime/60), s=Math.floor(playTime%60);
  drawTextC('TIME  '+m+':'+(s<10?'0':'')+s+'      DEATHS  '+deaths+'      GUARDS SLAIN  '+guards.filter(gd=>!alive(gd)).length+' / '+guards.length,SW/2,100,'#b8b0a0',1);
  if(Math.floor(clock*1.6)%2===0) drawTextC('PRESS SPACE TO PLAY AGAIN',SW/2,130,'#ffffff',1);
  drawTextC('ESC FOR MAIN MENU',SW/2,142,'#7a7468',1);
}
function present(){
  const W=screen.width, H=screen.height;
  sctx.fillStyle='#000'; sctx.fillRect(0,0,W,H);
  const aspect=SH/(SW*1.067);
  let bw=W, bh=W*aspect; if(bh>H){ bh=H; bw=H/aspect; }
  bw=Math.floor(bw); bh=Math.floor(bh);
  const ox=Math.floor((W-bw)/2), oy=Math.floor((H-bh)/2);
  sctx.imageSmoothingEnabled=true; sctx.imageSmoothingQuality='high';
  sctx.drawImage(buf,0,0,buf.width,buf.height,ox,oy,bw,bh);
}
function resize(){ const dpr=Math.min(2,window.devicePixelRatio||1); screen.width=Math.floor(innerWidth*dpr); screen.height=Math.floor(innerHeight*dpr); screen.style.width=innerWidth+'px'; screen.style.height=innerHeight+'px'; }
addEventListener('resize',resize); resize();

/* ============================================================
   GAME FLOW & LOOP
   ============================================================ */
function startGame(){
  loadLevel();
  const at={x:START.c*TW+16,y:floorY(START.r),dir:START.dir};
  kid=makeKid(at); guards=GUARD_DEFS.map(makeGuard); particles=[];
  checkpoint={...at,sword:false,maxHp:3}; playTime=0; deaths=0; paused=false;
  stopMusic(); inProgress=true; gameState='play'; showMsg('LEVEL 1  -  THE SULTAN\'S DUNGEON',3.5,'#ffd860');
}
function respawn(){
  const cp=checkpoint, sw=kid.sword, mh=kid.maxHp;
  kid=makeKid(cp); kid.sword=sw; kid.maxHp=mh; kid.hp=mh;
  for(const gd of guards){ if(alive(gd)){ const d=gd.def; Object.assign(gd,makeGuard(d)); } }
  particles=[]; showMsg('',0);
}
function update(dt){
  playTime+=dt;
  kidUpdate(dt);
  for(const gd of guards) guardUpdate(gd,dt);
  updateTraps(dt);
  updateParticles(dt);
  // camera & checkpoints
  const [rx,ry]=roomOf(kid);
  if(rx!==cam.rx||ry!==cam.ry){ cam.rx=rx; cam.ry=ry; pendingCP=true; }
  if(pendingCP&&kid.st==='stand'&&!nearestFoe(kid)&&ground(colOf(kid.x),rowOf(kid.y))){ checkpoint={x:kid.x,y:kid.y,dir:kid.dir}; pendingCP=false; }
  // hints
  if(alive(kid)&&GROUND_ST.has(kid.st)){ const key=K(colOf(kid.x),rowOf(kid.y));
    if(HINTS[key]&&!hintSeen[key]){ let ok=true;
      if(key==='13,0') ok=items.some(i=>i.type==='s');
      if(key==='21,1') ok=kid.sword;
      if(key==='32,1'||key==='46,1') ok=door&&!door.opening;
      if(ok){ hintSeen[key]=true; showMsg(HINTS[key],4.5); } } }
  if(msg.t>0) msg.t-=dt;
  if(shakeT>0) shakeT-=dt;
  if(flashT>0) flashT-=dt;
}
function step(dt){
  clock+=dt;
  if(pressed.mute){ muted=!muted; if(MG) MG.gain.value=muted?0:0.5; if(muted) stopMusic(); else if(gameState==='title') startMusic(); }
  if(gameState==='title'){
    if(inProgress&&(pressed.up||pressed.down)) titleSel=1-titleSel;
    if(pressed.jump||pressed.enter){ if(inProgress&&titleSel===0){ stopMusic(); gameState='play'; paused=false; } else startGame(); }
  } else if(gameState==='play'){
    if(paused){
      if(pressed.up) pauseSel=(pauseSel+2)%3;
      if(pressed.down) pauseSel=(pauseSel+1)%3;
      if(pressed.pause||pressed.menu) paused=false;
      else if(pressed.restart) startGame();
      else if(pressed.jump||pressed.enter){
        if(pauseSel===0) paused=false;
        else if(pauseSel===1) startGame();
        else { paused=false; gameState='title'; titleSel=0; startMusic(); }
      }
    } else if(pressed.pause||pressed.menu){ paused=true; pauseSel=0; }
    else if(pressed.restart) startGame();
    else {
      if(kid.st==='dead'&&kid.t>1.4&&(pressed.jump||pressed.enter)) respawn();
      update(dt);
      if(gameState==='win') inProgress=false;
    }
  } else if(gameState==='win'){
    if(pressed.menu){ gameState='title'; titleSel=0; startMusic(); }
    else if(pressed.jump||pressed.enter) startGame();
  }
  for(const k in pressed) pressed[k]=false;
}
function render(){
  if(gameState==='title') renderTitle();
  else {
    renderWorld(); drawHUD();
    if(paused){ g.fillStyle='rgba(0,0,0,0.65)'; g.fillRect(0,0,SW,VIEWH); drawTextC('PAUSED',SW/2,44,'#ffd860',3,'#5a1a0a');
      drawMenu(['RESUME','RESTART LEVEL','MAIN MENU'],pauseSel,82,16);
      drawTextC('W / S CHOOSE    SPACE SELECT    ESC RESUME',SW/2,148,'#7a7468'); }
    if(gameState==='win') renderWin();
  }
  present();
}
addEventListener('keydown',e=>{
  const a=KEYMAP[e.code];
  unlockAudio().then(()=>{ if(gameState==='title'&&!muted&&!musicBus&&audioRunning()){ themeStarted=true; startMusic(); } });
  if(a){ if(!keys[a]) pressed[a]=true; keys[a]=true; e.preventDefault(); }
});
addEventListener('keyup',e=>{ const a=KEYMAP[e.code]; if(a){ keys[a]=false; e.preventDefault(); } });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
// Resume the once-created context on any user gesture (required by autoplay policy).
addEventListener('pointerdown',()=>{ unlockAudio().then(()=>{ if(gameState==='title'&&!muted&&!musicBus&&audioRunning()){ themeStarted=true; startMusic(); } }); },{passive:true});
addEventListener('touchend',()=>{ unlockAudio().then(()=>{ if(gameState==='title'&&!muted&&!musicBus&&audioRunning()){ themeStarted=true; startMusic(); } }); },{passive:true});
screen.addEventListener('pointerdown',()=>{ unlockAudio().then(()=>{ if(gameState==='title'&&!muted&&!musicBus&&audioRunning()){ themeStarted=true; startMusic(); } }); });

loadLevel(); kid=makeKid({x:START.c*TW+16,y:floorY(START.r),dir:1}); guards=GUARD_DEFS.map(makeGuard);
let last=performance.now(), acc=0;
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.1) dt=0.1; acc+=dt;
  while(acc>=1/60){ step(1/60); acc-=1/60; }
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
